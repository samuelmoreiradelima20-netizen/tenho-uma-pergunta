<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenho uma pergunta... 👀</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="decoracao">
    <span class="emoji e1">❤️</span>
    <span class="emoji e2">😏</span>
    <span class="emoji e3">💕</span>
    <span class="emoji e4">😘</span>
    <span class="emoji e5">💘</span>
    <span class="emoji e6">😈</span>
    <span class="emoji e7">💋</span>
    <span class="emoji e8">🫦</span>
  </div>

  <main>
    <section>
      <p id="mensagem">Tenho uma pergunta importante... 👀</p>

      <h1>Quer sair comigo? 😏</h1>

      <p class="subtitulo">
        Prometo que a resposta certa é bem fácil de escolher...
      </p>

      <div class="botoes">
        <button id="sim">SIM ❤️</button>
        <button id="nao">NÃO 🙃</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
